async function updateMyPresence(){

    if(!myMobile){

        return;

    }


    try{

        await setDoc(

            doc(
                db,
                "users",
                getUserId(myMobile)
            ),

            {

}

/* =========================

function getChatId(){

    const users = [

    ];

/* =========================
   LOAD RECEIVER STATUS
========================= */

function loadReceiverStatus(){

    if(stopReceiverStatus){

        stopReceiverStatus();

        stopReceiverStatus =
            null;

    }


    receiverLastSeen =
        null;


    const userRef =
        doc(

            db,

            "users",

            getUserId(receiverMobile)

        );


    stopReceiverStatus =
        onSnapshot(

            userRef,

            function(snapshot){

                if(!snapshot.exists()){

                    receiverLastSeen =
                        null;

                    receiverStatus.innerText =
                        "⚪ Offline";

                    receiverStatus.className =
                        "offline";

                    return;

                }


                const data =
                    snapshot.data();


                receiverLastSeen =
                    data.lastSeen || null;


                updateReceiverStatus();

            },

            function(error){

                console.error(
                    "Status error:",
                    error
                );

                receiverStatus.innerText =
                    "স্ট্যাটাস পাওয়া যায়নি";

            }

        );

}



/* =========================
   UPDATE RECEIVER STATUS
========================= */

function updateReceiverStatus(){

    if(!receiverLastSeen){

        receiverStatus.innerText =
            "⚪ Offline";

        receiverStatus.className =
            "offline";

        return;

    }


    let lastTime;


    try{

        lastTime =
            receiverLastSeen.toMillis();

    }catch(error){

        receiverStatus.innerText =
            "⚪ Offline";

        receiverStatus.className =
            "offline";

        return;

    }


    const difference =
        Date.now() -
        lastTime;


    if(difference < 30000){

        receiverStatus.innerText =
            "🟢 Online";

        receiverStatus.className =
            "online";

    }else{

        receiverStatus.innerText =
            "⚪ Offline";

        receiverStatus.className =
            "offline";

    }

}



/* =========================

/* =========================
   LOAD MESSAGES
========================= */

function loadMessages(){

    if(stopMessages){

        stopMessages();

    }


    messagesBox.innerHTML =
        "মেসেজ লোড হচ্ছে...";


    const chatQuery = query(

        collection(
            db,
            "messages"
        ),

        where(

            "chatId",

            "==",

            getChatId()

        )

    );


    stopMessages = onSnapshot(

        chatQuery,

        function(snapshot){

            messagesBox.innerHTML =
                "";


            const messages = [];


            snapshot.forEach(

                function(doc){

                    messages.push(
                        doc.data()
                    );

                }

            );


            messages.sort(

                function(a,b){

                    const timeA =

                        a.createdAt

                        ?

                        a.createdAt.toMillis()

                        :

                        0;


                    const timeB =

                        b.createdAt

                        ?

                        b.createdAt.toMillis()

                        :

                        0;


                    return timeA - timeB;

                }

            );


            messages.forEach(

                function(data){

                    const message =
                        document.createElement(
                            "div"
                        );


                    const mine =

                        data.senderMobile ===
                        myMobile;


                    message.className =

                        mine

                        ?

                        "message sent"

                        :

                        "message received";


                    const sender =
                        document.createElement(
                            "div"
                        );


                    sender.className =
                        "sender";


                    sender.innerText =
                        data.senderName || "";


                    const text =
                        document.createElement(
                            "div"
                        );


                    text.innerText =
                        data.text || "";


                    message.appendChild(
                        sender
                    );


                    message.appendChild(
                        text
                    );


                    messagesBox.appendChild(
                        message
                    );

                }

            );


            messagesBox.scrollTop =
                messagesBox.scrollHeight;

        },


        function(error){

            console.error(error);

            messagesBox.innerHTML =
                "❌ মেসেজ লোড করা যায়নি।";

        }

    );

}

async function logout(){

    await setOffline();


    if(stopMessages){

        stopMessages();

    }


    if(stopReceiverStatus){

        stopReceiverStatus();

    }


    localStorage.removeItem(
        "nazmulChatName"
    );


    localStorage.removeItem(
        "nazmulChatMobile"
    );


    location.reload();

}

========================= */
