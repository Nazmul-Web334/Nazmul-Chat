<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Nazmul Chat</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef2f7;
}


/* LOGIN */

#loginBox{

    width:92%;
    max-width:400px;

    margin:70px auto;

    background:white;

    padding:25px;

    border-radius:18px;

    box-shadow:0 5px 25px rgba(0,0,0,.12);

}

#loginBox h2{

    text-align:center;

    color:#2563eb;

    margin-top:0;

}

input{

    width:100%;

    padding:14px;

    margin:7px 0;

    border:1px solid #d1d5db;

    border-radius:9px;

    font-size:16px;

    outline:none;

}

input:focus{

    border-color:#2563eb;

}

button{

    border:none;

    border-radius:9px;

    padding:13px 18px;

    background:#2563eb;

    color:white;

    font-size:16px;

    cursor:pointer;

}

#loginButton{

    width:100%;

    margin-top:10px;

}


/* CHAT */

#chatApp{

    display:none;

    width:100%;

    max-width:600px;

    margin:auto;

    height:100vh;

    background:white;

}


/* HEADER */

.header{

    background:#2563eb;

    color:white;

    padding:15px;

}

.headerTop{

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.header h3{

    margin:0 0 5px 0;

}

#myInfo{

    font-size:13px;

}

#myStatus{

    font-size:13px;

    margin-top:4px;

}

#logoutButton{

    background:#dc2626;

    padding:8px 12px;

    font-size:14px;

}


/* RECEIVER */

.receiverBox{

    background:#e5e7eb;

    padding:10px;

}

#chatButton{

    width:100%;

    margin-top:5px;

}


/* CHAT INFO */

#chatInfo{

    text-align:center;

    padding:10px;

    color:#2563eb;

    font-weight:bold;

}

#receiverStatus{

    font-size:13px;

    color:#555;

    margin-top:4px;

}


/* MESSAGES */

#messages{

    height:calc(100vh - 285px);

    overflow-y:auto;

    padding:15px;

    background:#f8fafc;

}

.message{

    max-width:75%;

    padding:10px 13px;

    margin:8px 0;

    border-radius:13px;

    word-wrap:break-word;

}

.sent{

    margin-left:auto;

    background:#2563eb;

    color:white;

}

.received{

    margin-right:auto;

    background:#e5e7eb;

    color:#111827;

}

.sender{

    font-size:12px;

    margin-bottom:4px;

    opacity:.7;

}


/* SEND */

.inputArea{

    display:flex;

    gap:6px;

    padding:10px;

    border-top:1px solid #ddd;

    background:white;

}

#messageInput{

    flex:1;

    margin:0;

}

#sendButton{

    width:80px;

}

</style>

</head>


<body>


<!-- =========================
     LOGIN
========================= -->

<div id="loginBox">

    <h2>💬 Nazmul Chat</h2>

    <input
        id="nameInput"
        type="text"
        placeholder="আপনার নাম"
    >

    <input
        id="mobileInput"
        type="tel"
        placeholder="আপনার মোবাইল নম্বর"
    >

    <button id="loginButton">
        প্রবেশ করুন
    </button>

</div>



<!-- =========================
     CHAT APP
========================= -->

<div id="chatApp">


    <!-- HEADER -->

    <div class="header">

        <div class="headerTop">

            <div>

                <h3>💬 Nazmul Chat</h3>

                <div id="myInfo"></div>

                <div id="myStatus">
                    🟢 Online
                </div>

            </div>


            <button id="logoutButton">
                Logout
            </button>

        </div>

    </div>



    <!-- RECEIVER -->

    <div class="receiverBox">

        <input
            id="receiverInput"
            type="tel"
            placeholder="যার সাথে চ্যাট করবেন তার মোবাইল নম্বর"
        >

        <button id="chatButton">
            💬 Chat শুরু করুন
        </button>

    </div>



    <!-- CHAT INFO -->

    <div id="chatInfo">

        আগে যার সাথে চ্যাট করবেন
        তার নম্বর দিন

        <div id="receiverStatus"></div>

    </div>



    <!-- MESSAGES -->

    <div id="messages"></div>



    <!-- SEND -->

    <div class="inputArea">

        <input
            id="messageInput"
            type="text"
            placeholder="মেসেজ লিখুন..."
            disabled
        >

        <button
            id="sendButton"
            disabled
        >
            পাঠান
        </button>

    </div>


</div>



<!-- =========================
     FIREBASE
========================= -->

<script type="module">


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getFirestore,
    collection,
    addDoc,
    query,
    where,
    onSnapshot,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC1654973_jPI2EZboOCr-3StHikY824A",

    authDomain:
    "nazmul-chat-c5935.firebaseapp.com",

    projectId:
    "nazmul-chat-c5935",

    storageBucket:
    "nazmul-chat-c5935.firebasestorage.app",

    messagingSenderId:
    "272668949196",

    appId:
    "1:272668949196:web:1454adde483c474b9fe069",

    measurementId:
    "G-YCQJ16FBNB"

};



/* =========================
   START FIREBASE
========================= */

const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);



/* =========================
   VARIABLES
========================= */

let myName = "";

let myMobile = "";

let receiverMobile = "";

let stopMessages = null;




/* =========================
   ELEMENTS
========================= */

const loginBox =
    document.getElementById("loginBox");

const chatApp =
    document.getElementById("chatApp");

const nameInput =
    document.getElementById("nameInput");

const mobileInput =
    document.getElementById("mobileInput");

const myInfo =
    document.getElementById("myInfo");

const receiverInput =
    document.getElementById("receiverInput");

const chatInfo =
    document.getElementById("chatInfo");

const receiverStatus =
    document.getElementById("receiverStatus");

const messagesBox =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");


/* =========================
   LOGIN
========================= */

document
    .getElementById("loginButton")
    .addEventListener(
        "click",
        login
    );


function login(){

    const name =
        nameInput.value.trim();

    const mobile =
        mobileInput.value.trim();


    if(name === ""){

        alert("আপনার নাম লিখুন।");

        return;
    }


    if(mobile === ""){

        alert("আপনার মোবাইল নম্বর লিখুন।");

        return;
    }


    myName = name;

    myMobile = mobile;


    localStorage.setItem(
        "nazmulChatName",
        myName
    );


    localStorage.setItem(
        "nazmulChatMobile",
        myMobile
    );


    openChat();

}


/* =========================
   OPEN CHAT
========================= */

function openChat(){

    loginBox.style.display =
        "none";

    chatApp.style.display =
        "block";


    myInfo.innerText =
        myName + " | " + myMobile;

}


/* =========================
   CHAT START
========================= */

document
    .getElementById("chatButton")
    .addEventListener(
        "click",
        startChat
    );


function startChat(){

    receiverMobile =
        receiverInput.value.trim();


    if(receiverMobile === ""){

        alert(
            "যার সাথে Chat করবেন তার মোবাইল নম্বর দিন।"
        );

        return;
    }


    if(receiverMobile === myMobile){

        alert(
            "নিজের সাথে Chat করা যাবে না।"
        );

        return;
    }


    chatInfo.innerHTML =
        "আপনি এখন Chat করছেন: " +
        receiverMobile +
        '<div id="receiverStatus">🟢 Chat প্রস্তুত</div>';


    messageInput.disabled =
        false;

    sendButton.disabled =
        false;


    loadMessages();

}
  /* =========================
   CHAT ID
========================= */

function getChatId(){

    const users = [
        myMobile,
        receiverMobile
    ];

    users.sort();

    return users[0] + "_" + users[1];
}


/* =========================
   SEND MESSAGE
========================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


async function sendMessage(){

    const text =
        messageInput.value.trim();


    if(text === ""){

        return;
    }


    try{

        await addDoc(
            collection(db, "messages"),
            {

                chatId: getChatId(),

                text: text,

                senderName: myName,

                senderMobile: myMobile,

                receiverMobile: receiverMobile,

                createdAt: serverTimestamp()

            }
        );


        messageInput.value = "";


    }catch(error){

        console.error(error);

        alert(
            "মেসেজ পাঠানো যায়নি।"
        );

    }

}
  /* =========================
   LOAD MESSAGES
========================= */

function loadMessages(){

    if(stopMessages){

        stopMessages();

    }


    messagesBox.innerHTML =
        "মেসেজ লোড হচ্ছে...";


    const chatQuery = query(

        collection(db, "messages"),

        where(
            "chatId",
            "==",
            getChatId()
        )

    );


    stopMessages = onSnapshot(

        chatQuery,

        function(snapshot){

            messagesBox.innerHTML = "";


            const messages = [];


            snapshot.forEach(
                function(doc){

                    messages.push(
                        doc.data()
                    );

                }
            );


            messages.sort(
                function(a, b){

                    const timeA =
                        a.createdAt
                        ? a.createdAt.toMillis()
                        : 0;

                    const timeB =
                        b.createdAt
                        ? b.createdAt.toMillis()
                        : 0;

                    return timeA - timeB;

                }
            );


            messages.forEach(
                function(data){

                    const message =
                        document.createElement("div");


                    const mine =
                        data.senderMobile === myMobile;


                    message.className =
                        mine
                        ? "message sent"
                        : "message received";


                    const sender =
                        document.createElement("div");


                    sender.className =
                        "sender";


                    sender.innerText =
                        data.senderName || "";


                    const text =
                        document.createElement("div");


                    text.innerText =
                        data.text || "";


                    message.appendChild(sender);

                    message.appendChild(text);

                    messagesBox.appendChild(message);

                }
            );


            messagesBox.scrollTop =
                messagesBox.scrollHeight;

        },


        function(error){

            console.error(error);

            messagesBox.innerHTML =
                "❌ মেসেজ লোড করা যায়নি।";

        }

    );

}


/* =========================
   LOGOUT
========================= */

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        logout
    );


function logout(){

    if(stopMessages){

        stopMessages();

    }


    localStorage.removeItem(
        "nazmulChatName"
    );


    localStorage.removeItem(
        "nazmulChatMobile"
    );


    location.reload();

}


/* =========================
   AUTO LOGIN
========================= */

const savedName =
    localStorage.getItem(
        "nazmulChatName"
    );


const savedMobile =
    localStorage.getItem(
        "nazmulChatMobile"
    );


if(savedName && savedMobile){

    myName =
        savedName;

    myMobile =
        savedMobile;

    openChat();

}

</script>

</body>

</html>
