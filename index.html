/* =========================

/* =========================
   USER DOCUMENT ID
========================= */

function getUserId(mobile){

    return encodeURIComponent(mobile);

}



/* =========================
   UPDATE MY PRESENCE
========================= */

async function updateMyPresence(){

    if(!myMobile){

        return;

    }


    try{

        await setDoc(

            doc(
                db,
                "users",
                getUserId(myMobile)
            ),

            {

                name: myName,

                mobile: myMobile,

                online: true,

                lastSeen: serverTimestamp()

            },

            {

                merge:true

            }

        );

        myStatus.innerHTML =
            "🟢 Online";

        myStatus.className =
            "online";


    }catch(error){

        console.error(
            "Presence error:",
            error
        );

    }

}



/* =========================
   START HEARTBEAT
========================= */

function startHeartbeat(){

    stopHeartbeat();


    updateMyPresence();


    heartbeatTimer =
        setInterval(

            updateMyPresence,

            10000

        );

}



/* =========================
   STOP HEARTBEAT
========================= */

function stopHeartbeat(){

    if(heartbeatTimer){

        clearInterval(
            heartbeatTimer
        );

        heartbeatTimer =
            null;

    }

}



/* =========================
   SET OFFLINE
========================= */

async function setOffline(){

    if(!myMobile){

        return;

    }


    stopHeartbeat();


    try{

        await setDoc(

            doc(
                db,
                "users",
                getUserId(myMobile)
            ),

            {

                online:false,

                lastSeen:serverTimestamp()

            },

            {

                merge:true

            }

        );

    }catch(error){

        console.error(error);

    }

}



/* =========================
   LOGIN
========================= */

document
    .getElementById("loginButton")

function login(){

    const name =
        nameInput.value.trim();

    const mobile =
        mobileInput.value.trim();

        alert(

/* =========================
   OPEN CHAT
========================= */

function openChat(){

startIncomingCallListener();
}



/* =========================
   CHAT START
========================= */

document
    .getElementById("chatButton")
    .addEventListener(
        "click",
        startChat
    );


function startChat(){

    receiverMobile =
        receiverInput.value.trim();


    if(receiverMobile === ""){

        alert(
            "যার সাথে Chat করবেন তার মোবাইল নম্বর দিন।"
        );

        return;

    }


    if(receiverMobile === myMobile){

        alert(
            "নিজের সাথে Chat করা যাবে না।"
        );

        return;

    }


    chatInfo.innerHTML =

        "আপনি এখন Chat করছেন: " +
        receiverMobile +

        '<div id="receiverStatus">স্ট্যাটাস দেখা হচ্ছে...</div>';


    messageInput.disabled =
        false;

    sendButton.disabled =
        false;


    loadMessages();
    loadReceiverStatus();
    loadTypingStatus();  

}


/* =========================
   CHAT ID
========================= */

function getChatId(){

    const users = [

        myMobile,

        receiverMobile

    ];


    users.sort();


    return users[0] +
        "_" +
        users[1];

}



/* =========================
   LOAD RECEIVER STATUS
========================= */

function loadReceiverStatus(){

    if(stopReceiverStatus){

        stopReceiverStatus();

        stopReceiverStatus =
            null;

    }


    receiverLastSeen =
        null;


    const userRef =
        doc(

            db,

            "users",

            getUserId(receiverMobile)

        );


    stopReceiverStatus =
        onSnapshot(

            userRef,

            function(snapshot){

                if(!snapshot.exists()){

                    receiverLastSeen =
                        null;

                    receiverStatus.innerText =
                        "⚪ Offline";

                    receiverStatus.className =
                        "offline";

                    return;

                }


                const data =
                    snapshot.data();


                receiverLastSeen =
                    data.lastSeen || null;


                updateReceiverStatus();

            },

            function(error){

                console.error(
                    "Status error:",
                    error
                );

                receiverStatus.innerText =
                    "স্ট্যাটাস পাওয়া যায়নি";

            }

        );

}



/* =========================
   UPDATE RECEIVER STATUS
========================= */

function updateReceiverStatus(){

    if(!receiverLastSeen){

        receiverStatus.innerText =
            "⚪ Offline";

        receiverStatus.className =
            "offline";

        return;

    }


    let lastTime;


    try{

        lastTime =
            receiverLastSeen.toMillis();

    }catch(error){

        receiverStatus.innerText =
            "⚪ Offline";

        receiverStatus.className =
            "offline";

        return;

    }


    const difference =
        Date.now() -
        lastTime;


    if(difference < 30000){

        receiverStatus.innerText =
            "🟢 Online";

        receiverStatus.className =
            "online";

    }else{

        receiverStatus.innerText =
            "⚪ Offline";

        receiverStatus.className =
            "offline";

    }

}



/* =========================
   CHECK STATUS EVERY 5 SEC
========================= */

setInterval(

    function(){

        if(receiverMobile){

            updateReceiverStatus();

        }

    },

    5000

);

/* =========================
   TYPING STATUS
========================= */

    }

    try{

messageInput.addEventListener(

/* =========================
   LOAD TYPING STATUS
========================= */

    }

/* =========================
   SEND MESSAGE
========================= */

sendButton.addEventListener(
    "click",

);


async function sendMessage(){

    const text =
        messageInput.value.trim();


    if(text === ""){

        return;

    }


    try{

        await addDoc(

            collection(
                db,
                "messages"
            ),

            {

                chatId:
                    getChatId(),

                text:
                    text,

                senderName:
                    myName,

                senderMobile:
                    myMobile,

                receiverMobile:
                    receiverMobile,

                createdAt:
                    serverTimestamp()

            }

        );


        await setTyping(false);

        messageInput.value =
            "";


    }catch(error){

        console.error(error);

        alert(
            "মেসেজ পাঠানো যায়নি।"
        );

    }

}



/* =========================
   LOAD MESSAGES
========================= */

function loadMessages(){

    if(stopMessages){

        stopMessages();

    }


    messagesBox.innerHTML =
        "মেসেজ লোড হচ্ছে...";


    const chatQuery = query(

        collection(
            db,
            "messages"
        ),

        where(

            "chatId",

            "==",

            getChatId()

        )

    );


    stopMessages = onSnapshot(

        chatQuery,

        function(snapshot){

            messagesBox.innerHTML =
                "";


            const messages = [];


            snapshot.forEach(

                function(doc){

                    messages.push(
                        doc.data()
                    );

                }

            );


            messages.sort(

                function(a,b){

                    const timeA =

                        a.createdAt

                        ?

                        a.createdAt.toMillis()

                        :

                        0;


                    const timeB =

                        b.createdAt

                        ?

                        b.createdAt.toMillis()

                        :

                        0;


                    return timeA - timeB;

                }

            );


            messages.forEach(

                function(data){

                    const message =
                        document.createElement(
                            "div"
                        );


                    const mine =

                        data.senderMobile ===
                        myMobile;


                    message.className =

                        mine

                        ?

                        "message sent"

                        :

                        "message received";


                    const sender =
                        document.createElement(
                            "div"
                        );


                    sender.className =
                        "sender";


                    sender.innerText =
                        data.senderName || "";


                    const text =
                        document.createElement(
                            "div"
                        );


                    text.innerText =
                        data.text || "";


                    message.appendChild(
                        sender
                    );


                    message.appendChild(
                        text
                    );


                    messagesBox.appendChild(
                        message
                    );

                }

            );


            messagesBox.scrollTop =
                messagesBox.scrollHeight;

        },


        function(error){

            console.error(error);

            messagesBox.innerHTML =
                "❌ মেসেজ লোড করা যায়নি।";

        }

    );

}

/* =========================
WEBRTC AUDIO / VIDEO CALLS
========================= */

const rtcConfig = {
iceServers: [
{
urls: "stun:stun.l.google.com:19302"
}
]
};

function showCallStatus(message) {
callStatus.innerText = message;
callStatus.style.display = "block";
}

function hideIncomingCall() {
incomingCallBox.style.display = "none";
}

function listenForRemoteCandidates(collectionName) {
    if (stopCandidateListener) {
        stopCandidateListener();
        stopCandidateListener = null;
    }

    const candidatesRef = collection(
        db,
        "calls",
        currentCallId,
        collectionName
    );

    stopCandidateListener = onSnapshot(
        candidatesRef,
        snapshot => {
            snapshot.docChanges().forEach(async change => {
                if (change.type !== "added") return;

                const candidateData = change.doc.data();

                try {
                    if (peerConnection && peerConnection.remoteDescription) {
                        await peerConnection.addIceCandidate(
                            new RTCIceCandidate(candidateData)
                        );
                    } else {
                        pendingCandidates.push(candidateData);
                    }
                } catch (error) {
                    console.error("ICE candidate error:", error);
                }
            });
        },
        error => console.error("Candidate listener error:", error)
    );
}

function setupPeerConnection(candidateCollection) {
peerConnection = new RTCPeerConnection(rtcConfig);

localStream.getTracks().forEach(track => {
    peerConnection.addTrack(track, localStream);
});

peerConnection.onicecandidate = async event => {
    if (!event.candidate || !currentCallId) return;

    try {
        await addDoc(
            collection(
                db,
                "calls",
                currentCallId,
                candidateCollection
            ),
            event.candidate.toJSON()
        );
    } catch (error) {
        console.error("Could not send ICE candidate:", error);
    }
};

peerConnection.ontrack = event => {
    if (event.streams && event.streams[0]) {
        remoteVideo.srcObject = event.streams[0];
    }

    if (currentCallType === "video") {
        remoteVideoBox.style.display = "block";
    }
};

peerConnection.onconnectionstatechange = () => {
    if (!peerConnection) return;

    const state = peerConnection.connectionState;

    if (state === "connected") {
        isCallActive = true;
        showCallStatus("🟢 কল সংযুক্ত হয়েছে");
    } else if (state === "failed") {
        showCallStatus(
            "সংযোগ ব্যর্থ হয়েছে। নেটওয়ার্ক পরীক্ষা করো।"
        );
    } else if (state === "disconnected") {
        showCallStatus("সংযোগ বিচ্ছিন্ন হয়েছে...");
    }
};

}

async function startCall(type) {
if (!receiverMobile) {
alert("আগে অপর ব্যক্তির নম্বর দিয়ে Chat শুরু করো।");
return;
}

if (currentCallId || peerConnection) {
    alert("আগের কলটি শেষ করে আবার চেষ্টা করো।");
    return;
}

try {
    currentCallType = type;

    localStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: type === "video"
    });

    localVideo.srcObject = localStream;

    localVideoBox.style.display =
        type === "video" ? "block" : "none";

    remoteVideoBox.style.display =
        type === "video" ? "block" : "none";

    setupPeerConnection("callerCandidates");

    const callRef = doc(collection(db, "calls"));
    currentCallId = callRef.id;

    await setDoc(callRef, {
        callerMobile: myMobile,
        callerName: myName,
        receiverMobile: receiverMobile,
        type: type,
        status: "creating",
        createdAt: serverTimestamp()
    });

    const offer = await peerConnection.createOffer();

    await peerConnection.setLocalDescription(offer);

    await setDoc(
        callRef,
        {
            offer: {
                type: offer.type,
                sdp: offer.sdp
            },
            status: "ringing"
        },
        { merge: true }
    );

    endCallButton.style.display = "block";

    showCallStatus(
        "📞 কল করা হচ্ছে: " + receiverMobile
    );

    stopCurrentCall = onSnapshot(callRef, async snapshot => {
        if (!snapshot.exists()) return;

        const data = snapshot.data();

        if (
            data.answer &&
            peerConnection &&
            !peerConnection.remoteDescription
        ) {
            try {
                await peerConnection.setRemoteDescription(
                    new RTCSessionDescription(data.answer)
                );

                listenForRemoteCandidates("receiverCandidates");
            } catch (error) {
                console.error("Answer error:", error);
            }
        }

        if (
            data.status === "ended" ||
            data.status === "rejected"
        ) {
            cleanupCall();
        }
    });

} catch (error) {
    console.error("Start call error:", error);

    alert(
        "কল শুরু করা যায়নি। ক্যামেরা ও মাইক্রোফোনের অনুমতি এবং HTTPS সংযোগ পরীক্ষা করো।"
    );

    await cleanupCall();
}

}

function startIncomingCallListener() {
if (stopIncomingCalls) {
stopIncomingCalls();
stopIncomingCalls = null;
}

const callsQuery = query(
    collection(db, "calls"),
    where("receiverMobile", "==", myMobile)
);

stopIncomingCalls = onSnapshot(
    callsQuery,
    snapshot => {
        snapshot.docChanges().forEach(change => {
            const data = change.doc.data();

            if (
                data.status === "ringing" &&
                data.callerMobile !== myMobile &&
                !currentCallId
            ) {
                incomingCallData = {
                    ...data,
                    id: change.doc.id
                };

                incomingCallText.innerText =
                    "📞 " + (data.callerName || data.callerMobile) +
                    " আপনাকে " +
                    (data.type === "video" ? "ভিডিও" : "অডিও") +
                    " কল করছেন";

                incomingCallBox.style.display = "block";
            }

            if (
                incomingCallData &&
                incomingCallData.id === change.doc.id &&
                data.status !== "ringing"
            ) {
                hideIncomingCall();
            }
        });
    },
    error => console.error("Incoming call error:", error)
);

}

async function acceptCall() {
if (!incomingCallData) return;

const callData = incomingCallData;

try {
    currentCallId = callData.id;
    currentCallType = callData.type;

    localStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: currentCallType === "video"
    });

    localVideo.srcObject = localStream;

    localVideoBox.style.display =
        currentCallType === "video" ? "block" : "none";

    remoteVideoBox.style.display =
        currentCallType === "video" ? "block" : "none";

    setupPeerConnection("receiverCandidates");

    await peerConnection.setRemoteDescription(
        new RTCSessionDescription(callData.offer)
    );

    listenForRemoteCandidates("callerCandidates");

    const answer = await peerConnection.createAnswer();

    await peerConnection.setLocalDescription(answer);

    await setDoc(
        doc(db, "calls", currentCallId),
        {
            answer: {
                type: answer.type,
                sdp: answer.sdp
            },
            status: "active"
        },
        { merge: true }
    );

    const callRef = doc(db, "calls", currentCallId);

    stopCurrentCall = onSnapshot(callRef, snapshot => {
        if (!snapshot.exists()) return;

        const data = snapshot.data();

        if (
            data.status === "ended" ||
            data.status === "rejected"
        ) {
            cleanupCall();
        }
    });

    incomingCallData = null;
    hideIncomingCall();

    endCallButton.style.display = "block";

    showCallStatus("🔄 কল সংযোগ হচ্ছে...");

} catch (error) {
    console.error("Accept call error:", error);

    alert(
        "কল রিসিভ করা যায়নি। ক্যামেরা ও মাইক্রোফোনের অনুমতি পরীক্ষা করো।"
    );

    await cleanupCall();
}

}

async function rejectCall() {
if (!incomingCallData) return;

const callId = incomingCallData.id;

try {
    await setDoc(
        doc(db, "calls", callId),
        { status: "rejected" },
        { merge: true }
    );
} catch (error) {
    console.error("Reject call error:", error);
}

incomingCallData = null;
hideIncomingCall();

}

async function endCall() {
const callId = currentCallId;

if (callId) {
    try {
        await setDoc(
            doc(db, "calls", callId),
            { status: "ended" },
            { merge: true }
        );
    } catch (error) {
        console.error("End call error:", error);
    }
}

await cleanupCall();

}

async function cleanupCall() {
if (stopCurrentCall) {
stopCurrentCall();
stopCurrentCall = null;
}

if (stopCandidateListener) {
    stopCandidateListener();
    stopCandidateListener = null;
}

if (peerConnection) {
    peerConnection.ontrack = null;
    peerConnection.close();
    peerConnection = null;
}

if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
}

localVideo.srcObject = null;
remoteVideo.srcObject = null;

localVideoBox.style.display = "none";
remoteVideoBox.style.display = "none";
endCallButton.style.display = "none";
callStatus.style.display = "none";

currentCallId = null;
currentCallType = null;
isCallActive = false;

}

/* CONNECT CALL BUTTONS */

audioCallButton.addEventListener(
"click",
() => startCall("audio")
);

videoCallButton.addEventListener(
"click",
() => startCall("video")
);

acceptCallButton.addEventListener(
"click",
acceptCall
);

rejectCallButton.addEventListener(
"click",
rejectCall
);

endCallButton.addEventListener(
"click",
endCall
);

async function logout(){

    await setOffline();


    if(stopMessages){

        stopMessages();

    }


    if(stopReceiverStatus){

        stopReceiverStatus();

    }


    localStorage.removeItem(
        "nazmulChatName"
    );


    localStorage.removeItem(
        "nazmulChatMobile"
    );


    location.reload();

}
